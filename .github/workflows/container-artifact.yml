name: Build and Store Container Artifact

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t vulnerable-code-team1:latest .

      - name: Save image as tar
        run: docker save vulnerable-code-team1:latest -o container-image.tar

      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vulnerable-code-team1:latest
          format: cyclonedx-json
          output-file: image-sbom.json
          upload-artifact: false

      - name: Scan image SBOM with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: image-sbom.json
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to Security tab
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image archive
        if: github.ref == 'refs/heads/main'
        run: cosign sign-blob --yes --bundle container-image.tar.bundle container-image.tar

      - name: Upload container, SBOM and signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-artifact
          path: |
            container-image.tar
            container-image.tar.bundle
            image-sbom.json
          if-no-files-found: warn
